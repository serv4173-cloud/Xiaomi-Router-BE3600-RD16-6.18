# Reproducible check: fivefold3 + RD15 patches + RD16 layer.
# Runs only by hand (workflow_dispatch). Stops at `make target/linux/prepare`:
# no full build, no Xiaomi or Wi-Fi vendor files are downloaded.
# DRAFT: the result of this run is the first real check of the layer.
name: rd16-6.18-patch-check

on:
  workflow_dispatch:

env:
  FIVEFOLD3_SHA: e46ea77ba4f431c72301c3d07220e454450b3070
  RD15_SHA: d9c8a55a1eedf0956f85f0ef2a591a30d0415464

jobs:
  patch-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout RD16 layer
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Clone pinned sources (read only)
        run: |
          set -eu
          git clone https://github.com/fivefold3/openwrt-gl-be3600.git tree
          git -C tree checkout --detach "$FIVEFOLD3_SHA"
          git clone https://github.com/victorpivotto-cloud/openwrt-xiaomi-be3600-rd15.git rd15
          git -C rd15 checkout --detach "$RD15_SHA"
          test "$(cat rd15/BASE_COMMIT)" = "$FIVEFOLD3_SHA"

      - name: Apply RD15 patches (check first)
        run: |
          set -eu
          cd tree
          for p in ../rd15/patches/*.patch; do
            git apply --check "$p"
            git apply "$p"
            echo "applied $(basename "$p")"
          done
          cp -R ../rd15/openwrt-tree/. .
          cp ../rd15/configs/feeds.conf feeds.conf

      - name: Apply RD16 layer
        run: |
          set -eu
          sh overlay/scripts/prepare-tree-rd16.sh "$PWD/tree"
          grep -q 'define Device/xiaomi_rd16' tree/target/linux/qualcommbe/image/ipq53xx.mk

      - name: Check RD16 DTS braces
        run: |
          set -eu
          f=tree/target/linux/qualcommbe/dts/ipq5332-xiaomi-rd16.dts
          test -f "$f"
          python3 - "$f" <<'PY'
          import re, sys
          t = re.sub(r'/\*.*?\*/', '', open(sys.argv[1], encoding='utf-8').read(), flags=re.S)
          assert t.count('{') == t.count('}'), 'unbalanced braces'
          print('braces balanced')
          PY

      - name: Feeds, defconfig and kernel prepare (no full build)
        run: |
          set -eu
          cd tree
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk gettext \
            git libncurses-dev libssl-dev python3 rsync swig unzip zlib1g-dev file wget
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig
          grep -q '^CONFIG_TARGET_qualcommbe_ipq53xx_DEVICE_xiaomi_rd16=y' .config
          make target/linux/prepare V=s -j"$(nproc)"

      - name: Compile RD16 DTS with dtc
        run: |
          set -eu
          sudo apt-get install -y -qq device-tree-compiler
          cd tree
          k=$(ls -d build_dir/target-*/linux-qualcommbe_ipq53xx/linux-6.18.* | head -n1)
          d="$k/arch/arm64/boot/dts/qcom"
          mkdir -p "$d"
          [ -f "$d/ipq5332-xiaomi-rd16.dts" ] || cp target/linux/qualcommbe/dts/ipq5332-xiaomi-rd16.dts "$d/"
          inc="-I $k/arch/arm64/boot/dts -I $k/scripts/dtc/include-prefixes -I $k/include"
          cpp -nostdinc -undef -x assembler-with-cpp -D__DTS__ $inc \
            "$d/ipq5332-xiaomi-rd16.dts" -o /tmp/rd16.pp.dts
          dtc -@ -I dts -O dtb -o /tmp/rd16.dtb $inc /tmp/rd16.pp.dts
          ls -l /tmp/rd16.dtb
          dtc -I dtb -O dts /tmp/rd16.dtb | grep -E 'compatible = "xiaomi,rd16"'

      - name: Upload expanded .config
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patch-check-config
          path: tree/.config
          include-hidden-files: true
